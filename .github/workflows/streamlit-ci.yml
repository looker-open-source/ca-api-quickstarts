name: Streamlit CI

on: push

jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: 'google-github-actions/auth@v3'
        with:
          # TODO: Setup CI specific project and workload identity
          project_id: 'next25-workshop'
          workload_identity_provider: 'projects/640484341613/locations/global/workloadIdentityPools/github-workflows'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: streamlit/streamlit-app-action@v0.0.3
        with:
          app-path: app.py
